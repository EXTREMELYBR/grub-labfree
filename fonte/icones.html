<!doctype html><html><head><meta charset="utf-8"><style>
/* Ícones do menu de boot (um por classe de entrada), desenhados a 96 px e reduzidos a 32 px pelo gerador.
   Ordem fixa (a mesma de ICONES no gerar-tema.py): linux, windows, configuracoes, reiniciar, desligar, avancado,
   reparar.
   A página é maior que a faixa de ícones porque o Chrome sem tela não desenha janelas muito pequenas. */
html,body{margin:0;width:800px;height:400px;overflow:hidden;background:transparent}
svg{width:96px;height:96px;display:block;position:absolute;top:0}
svg:nth-of-type(1){left:0}svg:nth-of-type(2){left:96px}svg:nth-of-type(3){left:192px}
svg:nth-of-type(4){left:288px}svg:nth-of-type(5){left:384px}svg:nth-of-type(6){left:480px}
svg:nth-of-type(7){left:576px}
.t{fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<!-- linux: pinguim (barriga, olhos e bico vazados) -->
<svg viewBox="0 0 24 24"><defs><mask id="p"><rect width="24" height="24" fill="#fff"/>
  <ellipse cx="12" cy="15.6" rx="3.7" ry="4.6" fill="#000"/><circle cx="10.5" cy="6.6" r=".95" fill="#000"/>
  <circle cx="13.5" cy="6.6" r=".95" fill="#000"/></mask></defs>
  <g mask="url(#p)" fill="#fff"><path d="M12 2c-2.6 0-4 2.1-4 4.7 0 1.5.2 2.4-.7 3.7C5.9 12.4 4.5 14.5 4.5 17c0 1.6.7 2.8 1.8 3.5h11.4c1.1-.7 1.8-1.9 1.8-3.5 0-2.5-1.4-4.6-2.8-6.6-.9-1.3-.7-2.2-.7-3.7C16 4.1 14.6 2 12 2z"/></g>
  <path d="M10.6 8.6h2.8L12 10.2z" fill="#fff"/>
  <ellipse cx="7.6" cy="21" rx="2.6" ry="1.2" fill="#fff"/><ellipse cx="16.4" cy="21" rx="2.6" ry="1.2" fill="#fff"/></svg>
<!-- windows: quatro janelas -->
<svg viewBox="0 0 24 24"><g fill="#fff"><rect x="3.5" y="3.5" width="7.8" height="7.8" rx="1"/><rect x="12.7" y="3.5" width="7.8" height="7.8" rx="1"/><rect x="3.5" y="12.7" width="7.8" height="7.8" rx="1"/><rect x="12.7" y="12.7" width="7.8" height="7.8" rx="1"/></g></svg>
<!-- configuracoes da placa-mãe: chip -->
<svg viewBox="0 0 24 24" class="t"><rect x="5" y="5" width="14" height="14" rx="2.5"/><rect x="9.25" y="9.25" width="5.5" height="5.5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>
<!-- reiniciar: seta circular -->
<svg viewBox="0 0 24 24" class="t"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v5h-5"/></svg>
<!-- desligar -->
<svg viewBox="0 0 24 24" class="t"><path d="M12 2.5v9"/><path d="M17.7 6.3a8.5 8.5 0 1 1-11.4 0"/></svg>
<!-- avancado: terminal -->
<svg viewBox="0 0 24 24" class="t"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></svg>
<!-- reparar: chave inglesa -->
<svg viewBox="0 0 24 24" class="t"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
</body></html>
