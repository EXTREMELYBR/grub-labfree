# =============================================================================
#  GRUB LabFree — configuração central do Diagnóstico e Reparo Automático
#
#  Lido pelos dois ambientes: o SystemRescue (bash: ". reparo.conf") e o Windows PE (cmd: "for /f").
#  Por isso o formato é rígido: uma linha CHAVE=valor, sem aspas, sem espaços em volta do "=", sem nada depois do
#  valor. Linhas começadas por "#" são comentários.
#
#  Fica na partição de recuperação em \labfree\reparo.conf. Mudou? Rode "sudo grub-labfree reparo-atualizar" (ou
#  edite direto na partição).
# =============================================================================

# ---------------------------------------------------------------- modo de operação
# Modo usado pela opção principal do menu "Diagnóstico e reparo automático":
#   1 = só diagnóstico (não muda nada nos discos; só grava os registros na partição de recuperação)
#   2 = reparo seguro (correções de baixo risco, só em alvos identificados com segurança)
#   3 = reparo avançado controlado (reinstalar o GRUB, refazer initramfs, bcdboot, etc.; regras abaixo)
MODO_PADRAO=2
# O modo 3 só roda se isto for "sim" (a opção fica em "Opções avançadas (para técnicos)").
PERMITIR_MODO_3=sim

# ---------------------------------------------------------------- disco físico
# Acima destes números de setores o disco é tratado como "falhando": nada é escrito nele (só leitura e relatório).
SMART_LIMITE_REALOCADOS=100
SMART_LIMITE_PENDENTES=0
SMART_LIMITE_INCORRIGIVEIS=0
# Erros de leitura do kernel (dmesg) durante o diagnóstico acima deste número também bloqueiam a escrita no disco.
LIMITE_ERROS_LEITURA=0
# Outros erros de E/S (comando abortado, tempo esgotado: cabo, controladora...) acima disto também bloqueiam.
LIMITE_ERROS_IO=10

# ---------------------------------------------------------------- Linux (SystemRescue)
# ext2/3/4: no modo 2 roda "e2fsck -p" (só correções seguras). No modo 3, se o -p não resolver, "e2fsck -y".
EXT_PERMITIR_Y_MODO_3=sim
# XFS com registro (log) pendente: no modo 3 monta e desmonta para reproduzir o log antes do xfs_repair.
# Nunca é usado "xfs_repair -L" (zera o log e perde dados) automaticamente.
XFS_REPRODUZIR_LOG_MODO_3=sim
# Partição EFI (FAT32) com erro: corrigir com "fsck.fat -a" a partir do modo 2.
FAT_CORRIGIR=sim
# Modo 3: reinstalar o GRUB do Linux (Debian/Ubuntu/Mint) quando os arquivos de boot estiverem faltando.
LINUX_REINSTALAR_GRUB_MODO_3=sim
# Modo 3: recriar o initramfs que estiver faltando.
LINUX_REFAZER_INITRAMFS_MODO_3=sim

# ---------------------------------------------------------------- Windows
# Usar o Windows PE (se estiver na partição) para o chkdsk e o reparo do boot do Windows.
WINPE_USAR=sim
# Também passar pelo Windows PE no modo 1 (chkdsk só de leitura).
WINPE_NO_DIAGNOSTICO=sim
# Sem o Windows PE: "relatar" (só avisa) ou "ntfsfix" (corrige o básico e deixa o chkdsk para o Windows; modo 2+).
NTFS_SEM_WINPE=relatar
# Windows hibernado ("inicialização rápida"): no modo 2 só confere (chkdsk de leitura). No modo 3, "descartar"
# apaga a hibernação (perde o que estava aberto) e corrige; "pular" não corrige.
NTFS_HIBERNADO_MODO_3=descartar
# Modo mínimo para o "sfc" offline nos arquivos do Windows (2 ou 3; 0 = nunca).
WINDOWS_SFC_MODO=3
# Fonte para o "DISM /RestoreHealth" (modo 3), relativa à partição de recuperação. Vazio = não roda o DISM.
# Exemplo: \labfree\fontes\install.wim:1   (a imagem precisa ser da MESMA versão e edição do Windows instalado)
WINDOWS_DISM_FONTE=
# Modo 3: refazer os arquivos de boot do Windows com o bcdboot quando estiverem faltando ou inconsistentes.
WINDOWS_BCDBOOT_MODO_3=sim
# BitLocker bloqueado: perguntar a chave de recuperação ao técnico (a chave nunca vai para os registros).
BITLOCKER_PEDIR_CHAVE=sim
# Segundos para o técnico responder se tem a chave (depois disso o volume fica de fora).
BITLOCKER_TEMPO_PERGUNTA=60
# Depois do Windows PE, voltar ao SystemRescue para conferir tudo de novo e fazer o relatório final.
VALIDAR_DEPOIS_DO_WINPE=sim

# ---------------------------------------------------------------- fim
# Reiniciar sozinho quando tudo terminou sem problema pendente (com problema, nunca reinicia sozinho).
REINICIAR_SE_OK=sim
TEMPO_REINICIO=30
# Quantas sessões de registro manter na partição de recuperação (as mais antigas são apagadas).
MANTER_SESSOES=30
# Rótulo de um pendrive opcional: se estiver conectado, recebe uma cópia dos registros.
ROTULO_PENDRIVE_LOGS=LABFREE-LOG
