<!doctype html><html><head><meta charset="utf-8"><style>
/* Fundo do menu de boot do servidor (GRUB), 1920x1080. Só decoração: o logo, os textos, o menu e o contador são
   desenhados pelo tema por cima (theme.txt), em posições relativas ao centro, para servir em qualquer tela.
   O GRUB corta as bordas em telas de outra proporção (desktop-image-scale-method "crop"): nada importante fica nas
   bordas. Gerar: python3 grub-labfree/gerar-tema.py */
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d1b3e}
.fundo{position:absolute;inset:0;
  background:radial-gradient(60% 55% at 50% 46%,rgba(26,115,232,.20) 0%,rgba(26,115,232,0) 70%),
             radial-gradient(70% 80% at 100% 100%,#16336e 0%,rgba(22,51,110,0) 60%),
             radial-gradient(55% 60% at 0% 0%,rgba(12,168,232,.10) 0%,rgba(12,168,232,0) 60%),
             linear-gradient(180deg,#0b1736 0%,#0d1b3e 50%,#0f2250 100%)}
.topo{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#0ca8e8,#1a73e8 55%,#0d47a1)}
.marca-agua{position:absolute;right:-90px;bottom:-60px;width:620px;opacity:.035;filter:grayscale(1) brightness(3)}
.linha{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(255,255,255,.06)}
</style></head><body>
<div class="fundo"></div><div class="topo"></div>
<img class="marca-agua" src="labfree-logo.png" alt="">
</body></html>
